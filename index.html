<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素机甲对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Consolas, monospace;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border: 4px solid #888888;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 26, 0.95);
            color: #ffffff;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .title {
            font-size: 24px;
            margin-bottom: 40px;
            color: #00ffcc;
            text-shadow: 4px 4px 0 #ff3366;
        }

        .winner-text {
            font-size: 32px;
            margin-bottom: 30px;
            animation: blink 0.5s infinite;
        }

        .winner-text.player1 {
            color: #00ffcc;
            text-shadow: 2px 2px 0 #009988;
        }

        .winner-text.player2 {
            color: #ff3366;
            text-shadow: 2px 2px 0 #cc2255;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        .instructions {
            font-size: 10px;
            line-height: 2;
            margin-bottom: 30px;
        }

        .instructions-row {
            display: flex;
            gap: 60px;
            margin-bottom: 20px;
        }

        .instructions-col {
            text-align: left;
        }

        .instructions-col h3 {
            font-size: 12px;
            margin-bottom: 15px;
        }

        .player1-header {
            color: #00ffcc;
        }

        .player2-header {
            color: #ff3366;
        }

        .key {
            display: inline-block;
            background: #333333;
            border: 2px solid #888888;
            padding: 5px 10px;
            margin: 2px;
            min-width: 30px;
            text-align: center;
        }

        .start-btn, .restart-btn {
            font-family: 'Courier New', Consolas, monospace;
            font-size: 14px;
            padding: 15px 30px;
            background: #00ffcc;
            color: #0a0a1a;
            border: 4px solid #009988;
            cursor: pointer;
            transition: all 0.1s;
        }

        .start-btn:hover, .restart-btn:hover {
            background: #00ddaa;
            transform: scale(1.05);
        }

        .start-btn:active, .restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div id="startScreen" class="overlay">
            <h1 class="title">像素机甲对战</h1>
            <div class="instructions">
                <div class="instructions-row">
                    <div class="instructions-col">
                        <h3 class="player1-header">玩家 1 (蓝色)</h3>
                        <p><span class="key">A</span><span class="key">D</span> 移动</p>
                        <p><span class="key">W</span> 攻击</p>
                        <p><span class="key">S</span> 防御</p>
                    </div>
                    <div class="instructions-col">
                        <h3 class="player2-header">玩家 2 (红色)</h3>
                        <p><span class="key">←</span><span class="key">→</span> 移动</p>
                        <p><span class="key">↑</span> 攻击</p>
                        <p><span class="key">↓</span> 防御</p>
                    </div>
                </div>
                <p><span class="key">R</span> 重新开始</p>
            </div>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
        </div>

        <div id="endScreen" class="overlay hidden">
            <h1 id="winnerText" class="winner-text">玩家 1 获胜!</h1>
            <button class="restart-btn" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        const CANVAS_WIDTH = 960;
        const CANVAS_HEIGHT = 540;
        const GROUND_Y = 450;
        const MECH_WIDTH = 80;
        const MECH_HEIGHT = 120;
        const MAX_HEALTH = 100;
        const MOVE_SPEED = 5;
        const ATTACK_DAMAGE = 15;
        const DEFENSE_REDUCTION = 0.7;
        const ATTACK_COOLDOWN = 500;
        const ATTACK_RANGE = 100;
        const ATTACK_DURATION = 300;

        const COLORS = {
            bgDark: '#0a0a1a',
            bgLight: '#1a1a3a',
            ground: '#2a2a4a',
            player1Primary: '#00ffcc',
            player1Secondary: '#009988',
            player2Primary: '#ff3366',
            player2Secondary: '#cc2255',
            healthBar: '#ff4444',
            healthBarBg: '#333333',
            uiText: '#ffffff',
            uiBorder: '#888888'
        };

        const ANIMATION_STATES = {
            IDLE: 'idle',
            WALK: 'walk',
            ATTACK: 'attack',
            DEFEND: 'defend',
            HIT: 'hit'
        };

        let gameState = 'start';
        let canvas, ctx;
        let player1, player2;
        let keys = {};
        let stars = [];
        let particles = [];
        let animationFrame = 0;

        class Mech {
            constructor(x, isPlayer1) {
                this.x = x;
                this.y = GROUND_Y - MECH_HEIGHT;
                this.width = MECH_WIDTH;
                this.height = MECH_HEIGHT;
                this.isPlayer1 = isPlayer1;
                this.health = MAX_HEALTH;
                this.facing = isPlayer1 ? 1 : -1;
                this.state = ANIMATION_STATES.IDLE;
                this.animFrame = 0;
                this.animTimer = 0;
                this.isAttacking = false;
                this.isDefending = false;
                this.attackTimer = 0;
                this.attackCooldown = 0;
                this.hitTimer = 0;
                this.primaryColor = isPlayer1 ? COLORS.player1Primary : COLORS.player2Primary;
                this.secondaryColor = isPlayer1 ? COLORS.player1Secondary : COLORS.player2Secondary;
            }

            update(deltaTime) {
                this.animTimer += deltaTime;
                if (this.animTimer > 150) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % this.getFrameCount();
                }

                if (this.attackCooldown > 0) {
                    this.attackCooldown -= deltaTime;
                }
                if (this.attackTimer > 0) {
                    this.attackTimer -= deltaTime;
                    if (this.attackTimer <= 0) {
                        this.isAttacking = false;
                        if (!this.isDefending) {
                            this.state = ANIMATION_STATES.IDLE;
                        }
                    }
                }
                if (this.hitTimer > 0) {
                    this.hitTimer -= deltaTime;
                }

                if (!this.isAttacking && !this.isDefending && this.hitTimer <= 0) {
                    const moveKey = this.isPlayer1 ?
                        (keys['a'] || keys['A'] ? -1 : (keys['d'] || keys['D'] ? 1 : 0)) :
                        (keys['ArrowLeft'] ? -1 : (keys['ArrowRight'] ? 1 : 0));

                    if (moveKey !== 0) {
                        this.x += moveKey * MOVE_SPEED;
                        this.facing = moveKey;
                        this.state = ANIMATION_STATES.WALK;
                    } else {
                        this.state = ANIMATION_STATES.IDLE;
                    }
                }

                const minX = 20;
                const maxX = CANVAS_WIDTH - this.width - 20;
                this.x = Math.max(minX, Math.min(maxX, this.x));
            }

            attack() {
                if (this.attackCooldown <= 0 && !this.isDefending) {
                    this.isAttacking = true;
                    this.state = ANIMATION_STATES.ATTACK;
                    this.attackTimer = ATTACK_DURATION;
                    this.attackCooldown = ATTACK_COOLDOWN;
                    this.animFrame = 0;
                    this.createAttackParticles();
                    return true;
                }
                return false;
            }

            defend(active) {
                if (!this.isAttacking) {
                    this.isDefending = active;
                    if (active) {
                        this.state = ANIMATION_STATES.DEFEND;
                    } else {
                        this.state = ANIMATION_STATES.IDLE;
                    }
                }
            }

            takeDamage(damage) {
                const actualDamage = this.isDefending ? damage * DEFENSE_REDUCTION : damage;
                this.health = Math.max(0, this.health - actualDamage);
                this.hitTimer = 200;
                if (!this.isAttacking && !this.isDefending) {
                    this.state = ANIMATION_STATES.HIT;
                }
                this.createHitParticles();
                return this.health <= 0;
            }

            getAttackHitbox() {
                if (!this.isAttacking) return null;
                return {
                    x: this.facing > 0 ? this.x + this.width : this.x - ATTACK_RANGE,
                    y: this.y + 20,
                    width: ATTACK_RANGE,
                    height: this.height - 40
                };
            }

            getHitbox() {
                return {
                    x: this.x + 10,
                    y: this.y,
                    width: this.width - 20,
                    height: this.height
                };
            }

            getFrameCount() {
                switch (this.state) {
                    case ANIMATION_STATES.WALK: return 4;
                    case ANIMATION_STATES.ATTACK: return 3;
                    case ANIMATION_STATES.DEFEND: return 2;
                    case ANIMATION_STATES.HIT: return 2;
                    default: return 2;
                }
            }

            createAttackParticles() {
                const px = this.facing > 0 ? this.x + this.width : this.x;
                const py = this.y + this.height / 2;
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: px,
                        y: py,
                        vx: this.facing * (2 + Math.random() * 3),
                        vy: (Math.random() - 0.5) * 4,
                        life: 300,
                        maxLife: 300,
                        color: this.primaryColor,
                        size: 4 + Math.random() * 4
                    });
                }
            }

            createHitParticles() {
                const px = this.x + this.width / 2;
                const py = this.y + this.height / 2;
                for (let i = 0; i < 12; i++) {
                    particles.push({
                        x: px,
                        y: py,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        life: 400,
                        maxLife: 400,
                        color: '#ffff00',
                        size: 3 + Math.random() * 5
                    });
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y);
                if (this.facing < 0) {
                    ctx.scale(-1, 1);
                }

                if (this.hitTimer > 0 && Math.floor(this.hitTimer / 50) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const bobY = this.state === ANIMATION_STATES.WALK ? Math.sin(this.animFrame * Math.PI / 2) * 3 : 0;
                const legOffset = this.state === ANIMATION_STATES.WALK ? Math.sin(this.animFrame * Math.PI / 2) * 8 : 0;
                const armSwing = this.state === ANIMATION_STATES.ATTACK ? 30 : 0;

                ctx.fillStyle = this.secondaryColor;
                this.drawPixelRect(ctx, -20, 80 + bobY + legOffset, 12, 40);
                this.drawPixelRect(ctx, 8, 80 + bobY - legOffset, 12, 40);

                ctx.fillStyle = '#1a1a2e';
                this.drawPixelRect(ctx, -22, 110 + bobY + legOffset, 16, 10);
                this.drawPixelRect(ctx, 6, 110 + bobY - legOffset, 16, 10);

                ctx.fillStyle = this.primaryColor;
                this.drawPixelRect(ctx, -25, 30 + bobY, 50, 55);

                ctx.fillStyle = this.secondaryColor;
                this.drawPixelRect(ctx, -20, 35 + bobY, 40, 45);

                ctx.fillStyle = this.primaryColor;
                this.drawPixelRect(ctx, -15, 5 + bobY, 30, 30);

                ctx.fillStyle = '#ffffff';
                this.drawPixelRect(ctx, 0, 12 + bobY, 12, 10);
                ctx.fillStyle = this.isPlayer1 ? '#00ffff' : '#ff0000';
                this.drawPixelRect(ctx, 2, 14 + bobY, 8, 6);

                ctx.save();
                ctx.translate(25, 45 + bobY);
                ctx.rotate((armSwing + (this.state === ANIMATION_STATES.ATTACK ? this.animFrame * 20 : 0)) * Math.PI / 180);

                ctx.fillStyle = this.secondaryColor;
                this.drawPixelRect(ctx, 0, -5, 25, 12);

                if (this.state === ANIMATION_STATES.ATTACK) {
                    ctx.fillStyle = this.primaryColor;
                    ctx.globalAlpha = 0.8;
                    this.drawPixelRect(ctx, 20, -15, 40, 30);
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = this.primaryColor;
                    this.drawPixelRect(ctx, 20, -8, 20, 18);
                }
                ctx.restore();

                if (this.isDefending) {
                    ctx.fillStyle = '#4488ff';
                    ctx.globalAlpha = 0.6 + Math.sin(Date.now() / 100) * 0.2;
                    ctx.beginPath();
                    ctx.arc(0, 60, 55, -Math.PI / 2, Math.PI / 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    ctx.strokeStyle = this.primaryColor;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 60, 55, -Math.PI / 2, Math.PI / 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            drawPixelRect(ctx, x, y, w, h) {
                ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
            }
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * (GROUND_Y - 50),
                    size: Math.random() * 2 + 1,
                    twinkle: Math.random() * Math.PI * 2
                });
            }

            document.addEventListener('keydown', (e) => {
                keys[e.key] = true;

                if (gameState === 'playing') {
                    if ((e.key === 'w' || e.key === 'W') && player1) {
                        player1.attack();
                    }
                    if (e.key === 'ArrowUp' && player2) {
                        player2.attack();
                    }
                    if ((e.key === 's' || e.key === 'S') && player1) {
                        player1.defend(true);
                    }
                    if (e.key === 'ArrowDown' && player2) {
                        player2.defend(true);
                    }
                }

                if (e.key === 'r' || e.key === 'R') {
                    if (gameState === 'playing' || gameState === 'ended') {
                        restartGame();
                    }
                }

                e.preventDefault();
            });

            document.addEventListener('keyup', (e) => {
                keys[e.key] = false;

                if ((e.key === 's' || e.key === 'S') && player1) {
                    player1.defend(false);
                }
                if (e.key === 'ArrowDown' && player2) {
                    player2.defend(false);
                }
            });
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            resetGame();
            gameState = 'playing';
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            resetGame();
            gameState = 'playing';
        }

        function resetGame() {
            player1 = new Mech(150, true);
            player2 = new Mech(CANVAS_WIDTH - 150 - MECH_WIDTH, false);
            particles = [];
        }

        function endGame(winner) {
            gameState = 'ended';
            const winnerText = document.getElementById('winnerText');
            winnerText.textContent = winner.isPlayer1 ? '玩家 1 获胜!' : '玩家 2 获胜!';
            winnerText.className = 'winner-text ' + (winner.isPlayer1 ? 'player1' : 'player2');
            document.getElementById('endScreen').classList.remove('hidden');
        }

        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function updateParticles(deltaTime) {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= deltaTime;
                return p.life > 0;
            });
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            gradient.addColorStop(0, COLORS.bgDark);
            gradient.addColorStop(1, COLORS.bgLight);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            stars.forEach(star => {
                star.twinkle += 0.05;
                const alpha = 0.5 + Math.sin(star.twinkle) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
            });

            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.strokeStyle = '#3a3a5a';
            ctx.lineWidth = 1;
            for (let x = 0; x < CANVAS_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = GROUND_Y; y < CANVAS_HEIGHT; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
        }

        function drawUI() {
            drawHealthBar(30, 30, player1, true);
            drawHealthBar(CANVAS_WIDTH - 230, 30, player2, false);
            drawControlsHint();
        }

        function drawHealthBar(x, y, mech, isLeft) {
            ctx.fillStyle = COLORS.healthBarBg;
            ctx.fillRect(x, y, 200, 25);

            ctx.fillStyle = COLORS.uiBorder;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, 200, 25);

            const healthWidth = (mech.health / MAX_HEALTH) * 194;
            ctx.fillStyle = COLORS.healthBar;
            ctx.fillRect(x + 3, y + 3, healthWidth, 19);

            ctx.fillStyle = COLORS.uiText;
            ctx.font = '10px "Courier New", Consolas, monospace';
            ctx.textAlign = isLeft ? 'left' : 'right';
            const name = mech.isPlayer1 ? '玩家 1' : '玩家 2';
            ctx.fillText(name, isLeft ? x : x + 200, y - 10);

            ctx.textAlign = 'center';
            ctx.fillText(`${Math.ceil(mech.health)}/${MAX_HEALTH}`, x + 100, y + 18);
        }

        function drawControlsHint() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '8px "Courier New", Consolas, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('按 R 重新开始', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 15);
        }

        function drawParticles() {
            particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(Math.floor(p.x - p.size / 2), Math.floor(p.y - p.size / 2), p.size, p.size);
            });
            ctx.globalAlpha = 1;
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            animationFrame++;

            if (gameState === 'playing') {
                player1.update(deltaTime);
                player2.update(deltaTime);
                updateParticles(deltaTime);

                const hitbox1 = player1.getAttackHitbox();
                const hitbox2 = player2.getAttackHitbox();
                const body1 = player1.getHitbox();
                const body2 = player2.getHitbox();

                if (hitbox1 && checkCollision(hitbox1, body2)) {
                    if (player2.takeDamage(ATTACK_DAMAGE)) {
                        endGame(player1);
                    }
                }
                if (hitbox2 && checkCollision(hitbox2, body1)) {
                    if (player1.takeDamage(ATTACK_DAMAGE)) {
                        endGame(player2);
                    }
                }
            }

            drawBackground();

            if (player1 && player2) {
                player1.draw(ctx);
                player2.draw(ctx);
                drawParticles();
                drawUI();
            }

            if (gameState !== 'ended' || document.getElementById('endScreen').classList.contains('hidden')) {
                requestAnimationFrame(gameLoop);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
